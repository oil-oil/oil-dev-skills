<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Before review starts, changes are checked against project conventions and the confirmed plan</title>
  <desc id="desc">On the left are the dev profile in the sample repo's AGENTS.md (quick-test, merge-gate, high-risk path src/storage/, do-not-edit path vendor/) and the allowed scope from the confirmed plan (src/export/** and tests/**). On the right is an excerpt of review_helper.py output on that sample repo: src/storage/project_file.py falls under a high-risk path and is routed to an independent deep review; vendor/ffmpeg/wrap.py falls under a do-not-edit path and requires confirmation; and 3 files fall outside the plan's allowed scope. Three connector lines link each rule to the files it flagged.</desc>

  <rect width="1200" height="580" rx="28" fill="#F5F3EE"/>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="58" fill="#6C7380" font-size="16" font-weight="700" letter-spacing="2.4">REAL OUTPUT</text>
    <text x="226" y="58" fill="#8A909A" font-size="16">Actual run on a sample repository, excerpted and wrapped for layout</text>
  </g>

  <g id="inputs" transform="translate(0 30)">
    <!-- AGENTS.md dev profile -->
    <rect x="64" y="56" width="416" height="246" rx="16" fill="#FFFFFF" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="92" y="98" fill="#8A909A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">AGENTS.md</text>
    <text x="452" y="98" text-anchor="end" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="650">Dev profile (oil-dev)</text>
    <path d="M92 116 H452" stroke="#ECE8E0" stroke-width="1.5"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#566174">
      <text x="92" y="158">quick-test</text>
      <text x="92" y="196">merge-gate</text>
      <text x="92" y="234">high-risk</text>
      <text x="92" y="272">do-not-edit</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#172033">
      <text x="218" y="158">pytest tests/{target} -q</text>
      <text x="218" y="196">make ci</text>
      <text x="218" y="234">src/storage/</text>
      <text x="218" y="272">vendor/</text>
    </g>
    <rect x="78" y="216" width="4" height="24" rx="2" fill="#D9822B"/>
    <rect x="78" y="254" width="4" height="24" rx="2" fill="#D2483C"/>

    <!-- confirmed plan scope -->
    <rect x="64" y="326" width="416" height="166" rx="16" fill="#FFFFFF" stroke="#E2DED5" stroke-width="1.5"/>
    <text x="92" y="368" fill="#8A909A" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">Confirmed plan</text>
    <text x="452" y="368" text-anchor="end" fill="#172033" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="650">Allowed scope</text>
    <path d="M92 386 H452" stroke="#ECE8E0" stroke-width="1.5"/>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#172033">
      <text x="92" y="428">src/export/**</text>
      <text x="92" y="466">tests/**</text>
    </g>
    <rect x="78" y="410" width="4" height="62" rx="2" fill="#4D6BFE"/>
  </g>

  <g id="links" transform="translate(0 30)" fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M480 228 C524 228 520 142 564 142" stroke="#D9822B"/>
    <path d="M480 266 C524 266 520 246 564 246" stroke="#D2483C"/>
    <path d="M480 440 C524 440 520 350 564 350" stroke="#4D6BFE"/>
    <circle cx="480" cy="228" r="5" fill="#D9822B" stroke="none"/>
    <circle cx="480" cy="266" r="5" fill="#D2483C" stroke="none"/>
    <circle cx="480" cy="440" r="5" fill="#4D6BFE" stroke="none"/>
  </g>

  <g id="output" transform="translate(0 30)">
    <rect x="564" y="56" width="572" height="456" rx="16" fill="#172033"/>
    <text x="596" y="98" fill="#9AA3B5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">review_helper.py</text>
    <text x="1108" y="98" text-anchor="end" fill="#E8EAF0" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="650">Review checklist · 5 files</text>
    <path d="M596 116 H1108" stroke="#2C3650" stroke-width="1.5"/>

    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18">
      <rect x="590" y="126" width="152" height="32" rx="7" fill="none" stroke="#F2A65A" stroke-width="1.5"/>
      <text x="666" y="148" text-anchor="middle" fill="#F2A65A" font-weight="650">High-risk path</text>
      <text x="756" y="148" fill="#C3C9D6">Route to independent deep review</text>

      <rect x="590" y="230" width="164" height="32" rx="7" fill="none" stroke="#FF8A7A" stroke-width="1.5"/>
      <text x="672" y="252" text-anchor="middle" fill="#FF8A7A" font-weight="650">Do-not-edit path</text>
      <text x="768" y="252" fill="#C3C9D6">Confirm whether edits are allowed</text>

      <rect x="590" y="334" width="192" height="32" rx="7" fill="none" stroke="#8FA4FF" stroke-width="1.5"/>
      <text x="686" y="356" text-anchor="middle" fill="#8FA4FF" font-weight="650">Outside plan scope</text>
      <text x="796" y="356" fill="#C3C9D6">3 files</text>
    </g>

    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" fill="#E8EAF0">
      <text x="614" y="196">src/storage/project_file.py</text>
      <text x="614" y="300">vendor/ffmpeg/wrap.py</text>
      <text x="614" y="404">src/storage/project_file.py</text>
      <text x="614" y="440">src/ui/toolbar.py</text>
      <text x="614" y="476">vendor/ffmpeg/wrap.py</text>
    </g>
  </g>
</svg>
