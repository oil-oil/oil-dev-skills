<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">oil-dev-skills：给 AI 编程 Agent 用的开发流程</title>
  <desc id="desc">一条 Git 轨道串起五个 Skill：在主线上用 oil-explore 探索、用 oil-plan 写方案；从主线分出一个 worktree，用 oil-delegate 委托实现、用 oil-code-review 独立审查；通过合并门禁回到主线，重测试只在门禁跑一次；最后用 oil-govern 治理。探索之后还有一条修缺陷支线：用 oil-bug-fix 先找根因再修，修好后回到主线。</desc>

  <rect width="1200" height="630" rx="28" fill="#F5F3EE"/>

  <g id="title-block" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="62" fill="#6C7380" font-size="16" font-weight="700" letter-spacing="2.4">AGENT SKILLS · DEV WORKFLOW</text>
    <rect x="64" y="80" width="52" height="5" rx="2.5" fill="#4D6BFE"/>
    <text x="61" y="154" fill="#172033" font-size="66" font-weight="760" letter-spacing="-2">oil-dev-skills</text>
    <text x="64" y="202" fill="#3A4456" font-size="27" font-weight="500">一套给 AI 编程 Agent 用的开发流程</text>
    <text x="64" y="238" fill="#6C7380" font-size="21">适合模块多、分支多、要长期维护的项目</text>
  </g>

  <g id="meta" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#8A909A" letter-spacing="1">
    <text x="1136" y="62" text-anchor="end">6 SKILLS · MIT</text>
  </g>

  <g id="track" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- main line -->
    <path d="M64 400 H1136" stroke="#172033" stroke-width="3"/>
    <!-- worktree branch: forks after the plan, merges at the gate -->
    <path d="M420 400 C480 400 470 200 540 200 H820 C885 200 870 400 920 400" stroke="#4D6BFE" stroke-width="3"/>
    <!-- bug-fix branch: forks after explore, merges back before the gate -->
    <path d="M200 400 C250 400 240 520 300 520 H700 C760 520 750 400 800 400" stroke="#D9822B" stroke-width="3"/>
  </g>

  <g id="lane-labels" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" fill="#8A909A">
    <text x="64" y="384">main</text>
    <text x="680" y="182" text-anchor="middle" fill="#7D8FE0">worktree</text>
    <text x="640" y="504" text-anchor="middle" fill="#D9A066">bugfix</text>
  </g>

  <g id="commits" fill="#4D6BFE">
    <circle cx="660" cy="200" r="5"/>
    <circle cx="700" cy="200" r="5"/>
  </g>

  <g id="nodes" stroke-width="3.5">
    <circle cx="140" cy="400" r="12" fill="#F5F3EE" stroke="#172033"/>
    <circle cx="320" cy="400" r="12" fill="#F5F3EE" stroke="#172033"/>
    <circle cx="590" cy="200" r="12" fill="#F5F3EE" stroke="#4D6BFE"/>
    <circle cx="770" cy="200" r="12" fill="#F5F3EE" stroke="#4D6BFE"/>
    <rect x="906" y="386" width="28" height="28" rx="4" transform="rotate(45 920 400)" fill="#172033" stroke="#172033"/>
    <circle cx="1084" cy="400" r="12" fill="#F5F3EE" stroke="#172033"/>
    <circle cx="500" cy="520" r="12" fill="#F5F3EE" stroke="#D9822B"/>
  </g>

  <g id="stage-labels" text-anchor="middle">
    <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="650" fill="#172033">
      <text x="140" y="444">探索</text>
      <text x="320" y="444">方案</text>
      <text x="590" y="244">委托实现</text>
      <text x="770" y="244">独立审查</text>
      <text x="920" y="444">合并门禁</text>
      <text x="1084" y="444">治理</text>
      <text x="500" y="564">修缺陷</text>
    </g>
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" fill="#566174">
      <text x="140" y="472">oil-explore</text>
      <text x="320" y="472">oil-plan</text>
      <text x="590" y="272">oil-delegate</text>
      <text x="770" y="272">oil-code-review</text>
      <text x="1084" y="472">oil-govern</text>
      <text x="500" y="592">oil-bug-fix</text>
    </g>
    <text x="920" y="472" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#566174">重测试只在这里跑</text>
  </g>
</svg>
